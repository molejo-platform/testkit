{{ define "page-footer" -}}
<footer class="page-footer">
  <span>{{ .T "footer.name" }}</span>
  <span class="footer-separator" aria-hidden="true">/</span>
  <span>{{ .T "footer.fixture" }} · {{ .T "build.label" }} {{ .Version }}</span>
  <span class="footer-separator" aria-hidden="true">/</span>
  <a class="footer-link" href="{{ .MolejoURL }}">{{ .T "footer.powered_by" }}</a>
</footer>
{{- end }}
