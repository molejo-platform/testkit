name: Release image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}" >&2
            exit 1
          fi
          source_version="$(cat VERSION)"
          if [[ "${GITHUB_REF_NAME}" != "${source_version}" ]]; then
            echo "release tag ${GITHUB_REF_NAME} does not match VERSION ${source_version}" >&2
            exit 1
          fi

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l *.go)"
          if [[ -n "${unformatted}" ]]; then
            echo "Go files require formatting:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      - name: Check module files
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Frontend tests
        run: npm ci && npm run test:frontend

      - name: Check Go vulnerabilities
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: "1.26.7"
          go-package: ./...

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      - name: Build release binary for local vulnerability scan
        run: CGO_ENABLED=0 go build -buildvcs=false -trimpath -o /tmp/testkit-security .

      - name: Scan release binary vulnerabilities locally
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary /tmp/testkit-security

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.description=Deterministic fixture for HTTP and Kubernetes tests
            org.opencontainers.image.licenses=Apache-2.0

      - name: Write release summary
        shell: bash
        run: |
          echo "## Published image" >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "\`${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo >> "${GITHUB_STEP_SUMMARY}"
          echo "\`${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}\`" >> "${GITHUB_STEP_SUMMARY}"
